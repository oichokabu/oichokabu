name: README Stats
on:
  schedule: [{cron: "0 3 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=oichokabu&count_private=true&show_icons=true&theme=discord_old_blurple
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: update stats card"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main
          done
          exit 1
