name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 */6 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # master HEAD, no tagged release since v3.34 (2023)
        with:
          # filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          config_timezone: Japan
          plugin_languages: yes
          plugin_languages_colors: "python: #346E9E, typescript: #007ACC"
          plugin_languages_details: percentage
          plugin_languages_sections: most-used # recently-used triggers a crash in the plugin's recent-commit analyzer
          commits_authoring: 59308114+oichokabu@users.noreply.github.com
